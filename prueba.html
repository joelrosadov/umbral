<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Umbral · prueba de fuentes</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;padding:24px 16px;background:#eef4f5;color:#17262b;}
  main{max-width:900px;margin:0 auto;}
  h1{font-size:22px;margin:0 0 6px;}
  p{color:#5f7177;margin:0 0 14px;line-height:1.5;}
  .wrap{overflow-x:auto;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 24px -14px rgba(0,0,0,.3);}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e1e8e9;font-size:14px;vertical-align:top;}
  th{background:#f3f6f6;font-size:12.5px;color:#5f7177;}
  td small{display:block;color:#5f7177;font-size:12px;word-break:break-all;margin-top:2px;}
  .ok{color:#2f9e6e;font-weight:700;} .bad{color:#d23a4f;font-weight:700;} .wait{color:#d39a12;font-weight:700;}
  #summary{margin-top:16px;font-weight:600;}
</style>
</head>
<body>
<main>
  <h1>Prueba de fuentes de datos</h1>
  <p>Comprueba si se puede leer cada fuente de riesgo. Cuando terminen todas las filas, toma una captura y envíala.</p>
  <p id="mode"></p>
  <div class="wrap"><table>
    <thead><tr><th>Fuente y punto</th><th>Resultado</th><th>Valor</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div>
  <div id="summary"></div>
</main>
<script src="vendor/geotiff.js"></script>
<script>
const qs = new URLSearchParams(location.search);
let PROXY = qs.get("proxy") || "";
try { if (PROXY) localStorage.setItem("umbralProxy", PROXY); else PROXY = localStorage.getItem("umbralProxy") || ""; } catch (e) {}
if (!PROXY) PROXY = "https://umbral-datos.joelrosadov.workers.dev";
PROXY = PROXY.replace(/\/+$/, "");
const via = u => `${PROXY}/?url=${encodeURIComponent(u)}`;
document.getElementById("mode").textContent = `Intermediario: ${PROXY}`;

const BAB = { lat: -1.8017, lon: -79.5346, n: "Babahoyo" };
const GYE = { lat: -2.2550, lon: -79.9050, n: "Guayaquil sur (estero)" };
const AQ = "https://aqueduct.wridata.org/AqueductFloods20/";
const TESTS = [
  { n: "Inundación de ríos · JRC GloFAS (1 en 100)", p: BAB, url: "https://jeodpp.jrc.ec.europa.eu/ftp/jrc-opendata/CEMS-GLOFAS/flood_hazard/RP100/ID59_N0_W80_RP100_depth.tif" },
  { n: "Altura sobre el cauce · HAND 30 m", p: BAB, url: "https://glo-30-hand.s3.us-west-2.amazonaws.com/v1/2021/Copernicus_DSM_COG_10_S02_00_W080_00_HAND.tif" },
  { n: "Elevación · Copernicus DEM 30 m", p: BAB, url: "https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_S02_00_W080_00_DEM/Copernicus_DSM_COG_10_S02_00_W080_00_DEM.tif" },
  { n: "Inundación costera · Aqueduct (1 en 100)", p: GYE, url: AQ + "inuncoast_historical_nosub_hist_rp0100_0.tif" },
  { n: "Inundación de ríos · Aqueduct (1 en 100)", p: BAB, url: AQ + "inunriver_historical_000000000WATCH_1980_rp00100.tif" }
];
const rows = document.getElementById("rows");
TESTS.forEach((t, i) => rows.insertAdjacentHTML("beforeend",
  `<tr><td>${t.n}<small>${t.p.n} · ${t.url}</small></td><td id="s${i}" class="wait">Probando…</td><td id="v${i}">—</td></tr>`));

const withTimeout = (p, ms, step) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error(`Sin respuesta tras ${ms / 1000} s en el paso: ${step}`)), ms))]);

async function probe(t, i) {
  const s = document.getElementById("s" + i), v = document.getElementById("v" + i);
  const t0 = performance.now();
  const step = txt => { s.innerHTML = `Probando…<small>${txt}</small>`; };
  try {
    step("1. Leyendo el primer fragmento");
    const r = await withTimeout(fetch(via(t.url), { headers: { Range: "bytes=0-1023" } }), 30000, "primer fragmento");
    if (!(r.status === 206 || r.status === 200)) throw new Error(`El servidor respondió ${r.status}: ${(await r.text()).slice(0, 120)}`);
    step("2. Abriendo el archivo");
    const tiff = await withTimeout(GeoTIFF.fromUrl(via(t.url), { allowFullFile: false }), 45000, "abrir archivo");
    const img = await withTimeout(tiff.getImage(), 45000, "leer encabezado");
    const [minX, minY, maxX, maxY] = img.getBoundingBox();
    const w = img.getWidth(), h = img.getHeight();
    const px = Math.floor((t.p.lon - minX) / (maxX - minX) * w), py = Math.floor((maxY - t.p.lat) / (maxY - minY) * h);
    const fd = img.getFileDirectory();
    const meta = `${w}×${h} px · ${img.isTiled ? "en bloques" : "en franjas"} · compresión ${fd.Compression} · predictor ${fd.Predictor || 1}`;
    if (px < 0 || py < 0 || px >= w || py >= h) throw new Error(`El punto queda fuera del archivo · ${meta}`);
    step(`3. Leyendo el valor del punto · ${meta}`);
    const x0 = Math.max(0, px - 1), y0 = Math.max(0, py - 1);
    const data = await withTimeout(img.readRasters({ window: [x0, y0, Math.min(w, px + 2), Math.min(h, py + 2)] }), 45000, "leer valor");
    const arr = Array.from(data[0]), nd = img.getGDALNoData();
    const valid = arr.filter(x => (nd === null || x !== nd) && Number.isFinite(x) && x > -1e30);
    const center = arr[(py - y0) * (Math.min(w, px + 2) - x0) + (px - x0)];
    s.className = "ok"; s.innerHTML = `Funciona en ${Math.round(performance.now() - t0)} ms<small>${meta}</small>`;
    const fmt = x => (nd !== null && x === nd) || !Number.isFinite(x) || x < -1e30 ? "sin dato" : `${Number(x).toFixed(2)} m`;
    v.innerHTML = `${fmt(center)}<small>máx. alrededor: ${valid.length ? Math.max(...valid).toFixed(2) + " m" : "sin dato"}</small>`;
  } catch (e) {
    s.className = "bad";
    s.innerHTML = `No se puede leer<small>${String(e.message || e).slice(0, 220)}</small>`;
  }
}
Promise.all(TESTS.map(probe)).then(() => {
  const ok = document.querySelectorAll("td.ok").length;
  document.getElementById("summary").textContent = `Listo: ${ok} de ${TESTS.length} fuentes funcionan.`;
});
</script>
</body>
</html>
